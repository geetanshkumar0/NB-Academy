<title>NB Academy</title>
<link rel="icon" id="favicon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%227%22%20fill%3D%22%23d2831a%22%2F%3E%3Cpath%20d%3D%22M7%2023V9l7%209V9M18%209h4.5a3%203%200%200%201%200%206H18zm0%206h5a3.2%203.2%200%200%201%200%206.5h-5z%22%20fill%3D%22none%22%20stroke%3D%22%230d3843%22%20stroke-width%3D%222.4%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* NB Academy styles. Layout: a sticky deep-teal navbar over a cool grey canvas. Course pages split into a course-index rail and a content column; activities are colour-coded by purpose (content, assessment, collaboration). */
:root{
  --bg:#f2f5f7; --surface:#ffffff; --surface-2:#e8edf1; --ink:#15212b; --muted:#566573; --line:#d4dce3;
  --nav:#0d3843; --nav-ink:#eaf4f6; --nav-muted:#a6c7cf; --nav-hover:#164b58;
  --brand:#0e6175; --brand-ink:#ffffff; --brand-soft:#dbeef2;
  --accent:#d2831a; --accent-soft:#fbecd5;
  --ok:#23764a; --ok-soft:#dff1e6; --warn:#985900; --warn-soft:#fbeed6; --bad:#b0342b; --bad-soft:#f8e0dc;
  --t-content:#2c66ad; --t-assess:#ad2f68; --t-collab:#21795f; --t-other:#5b6976; --t-comm:#7a4fb0;
  --shadow:0 1px 2px rgba(15,35,45,.06),0 6px 18px rgba(15,35,45,.07);
  --f-display:"Avenir Next","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ic-ink:#ffffff;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1418; --surface:#162027; --surface-2:#1d2a32; --ink:#e3eaef; --muted:#97a7b3; --line:#2a3842;
  --nav:#0a1d23; --nav-ink:#e3eef1; --nav-muted:#8fb2bb; --nav-hover:#14313a;
  --brand:#5cb4c8; --brand-ink:#06232b; --brand-soft:#173540;
  --accent:#efaa48; --accent-soft:#3a2b14;
  --ok:#6ac68e; --ok-soft:#163124; --warn:#efaa48; --warn-soft:#3a2b14; --bad:#ee7d72; --bad-soft:#3d1c1a;
  --t-content:#79a9e6; --t-assess:#e679a9; --t-collab:#67c4a5; --t-other:#9aa8b4; --t-comm:#b494e0;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); --ic-ink:#0e1418; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e1418; --surface:#162027; --surface-2:#1d2a32; --ink:#e3eaef; --muted:#97a7b3; --line:#2a3842;
  --nav:#0a1d23; --nav-ink:#e3eef1; --nav-muted:#8fb2bb; --nav-hover:#14313a;
  --brand:#5cb4c8; --brand-ink:#06232b; --brand-soft:#173540;
  --accent:#efaa48; --accent-soft:#3a2b14;
  --ok:#6ac68e; --ok-soft:#163124; --warn:#efaa48; --warn-soft:#3a2b14; --bad:#ee7d72; --bad-soft:#3d1c1a;
  --t-content:#79a9e6; --t-assess:#e679a9; --t-collab:#67c4a5; --t-other:#9aa8b4; --t-comm:#b494e0;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); --ic-ink:#0e1418; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--nav)}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:1.75rem;font-weight:650;letter-spacing:-.01em}
h2{font-size:1.2rem;font-weight:650}
h3{font-size:1.02rem;font-weight:650}
p{margin:0}
a{color:var(--brand)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
.muted{color:var(--muted)} .small{font-size:.86rem} .mono{font-family:var(--f-mono);font-size:.85em}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* Navbar */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--nav);color:var(--nav-ink)}
.nav-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:8px 18px;flex-wrap:wrap;min-height:56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:6px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;color:var(--nav-ink);padding:4px 0}
.brand b{font-family:var(--f-display);font-size:1.08rem;font-weight:700;letter-spacing:.01em}
.logo{width:30px;height:30px;flex:none}
.prim{display:flex;gap:2px;flex-wrap:wrap;flex:1;min-width:0}
.prim button{background:none;border:0;color:var(--nav-muted);padding:8px 12px;border-radius:6px;cursor:pointer;font-weight:550;white-space:nowrap}
.prim button:hover{background:var(--nav-hover);color:var(--nav-ink)}
.prim button.on{color:var(--nav-ink);box-shadow:inset 0 -3px 0 var(--accent);border-radius:6px 6px 0 0}
.nav-r{display:flex;align-items:center;gap:14px;margin-left:auto}
@media (max-width:760px){.prim{order:3;flex-basis:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -8px}.prim button.on{box-shadow:inset 0 -3px 0 var(--accent)}.switch{font-size:0;gap:0}}
.switch{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--nav-muted);cursor:pointer;user-select:none}
.switch input{appearance:none;width:34px;height:20px;border-radius:20px;background:var(--nav-hover);border:1px solid var(--nav-muted);position:relative;cursor:pointer;margin:0}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--nav-muted);transition:transform .15s}
.switch input:checked{background:var(--accent);border-color:var(--accent)}
.switch input:checked::after{transform:translateX(14px);background:#fff}
.umenu{position:relative}
.umenu summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;border-radius:30px;padding:2px}
.umenu summary::-webkit-details-marker{display:none}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.8rem;color:#fff;flex:none;letter-spacing:.02em}
.umenu .menu{position:absolute;right:0;top:calc(100% + 8px);min-width:230px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:6px;z-index:30}
.menu .who{padding:8px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:4px}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:6px;cursor:pointer}
.menu button:hover{background:var(--surface-2)}

/* Page */
.page{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
.phead{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;font-size:.84rem;color:var(--muted)}
.crumbs button{background:none;border:0;padding:0;color:var(--brand);cursor:pointer}
.crumbs span.sep{opacity:.5}
.ptitle{display:flex;align-items:center;gap:12px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;flex-wrap:wrap}
.tab{background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:550;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--brand)}

/* Buttons & chips */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:6px;cursor:pointer;font-weight:550;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 10px;font-size:.84rem}
.btn.danger{color:var(--bad)}
.btn.danger-solid{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--brand);cursor:pointer;text-align:left;font:inherit}
.link:hover{text-decoration:underline}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;font-weight:600;padding:2px 9px;border-radius:20px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.brand{background:var(--brand-soft);color:var(--brand)}
.demo{background:var(--accent-soft);color:var(--warn)}

/* Cards & blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.block>header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.block>.bb{padding:14px 18px}
.dash{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
@media (max-width:960px){.dash{grid-template-columns:minmax(0,1fr)}}

/* Course cards */
.cgridcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.ccard-img{height:104px;border:0;cursor:pointer;display:flex;align-items:flex-end;padding:12px;color:#fff;font-family:var(--f-mono);font-weight:700;letter-spacing:.06em;font-size:.82rem;text-align:left}
.ccard-b{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.ccard-b h3 .link{color:var(--ink);font-weight:650}
.prog{display:flex;align-items:center;gap:10px;font-size:.82rem;color:var(--muted);margin-top:auto}
.bar{flex:1;height:6px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:6px}

/* Timeline */
.tl{display:flex;flex-direction:column}
.tl-day{font-size:.8rem;font-weight:650;color:var(--muted);padding:12px 18px 6px;text-transform:uppercase;letter-spacing:.05em}
.tl-item{display:grid;grid-template-columns:52px auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 18px;border-top:1px solid var(--line)}
.tl-time{font-size:.82rem;color:var(--muted)}
.tl-item .t{min-width:0}
.tl-item .t .link{font-weight:600;color:var(--ink)}
@media (max-width:560px){.tl-item{grid-template-columns:auto minmax(0,1fr)}.tl-time{grid-column:1/-1}.tl-item>.act{grid-column:1/-1}}
.empty{padding:22px 18px;color:var(--muted);text-align:center}

/* Icons */
.ic{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;flex:none;color:var(--ic-ink)}
.ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:26px;height:26px;border-radius:6px}.ic.sm svg{width:15px;height:15px}
.ic.lg{width:46px;height:46px;border-radius:10px}.ic.lg svg{width:26px;height:26px}
.p-content{background:var(--t-content)} .p-assess{background:var(--t-assess)} .p-collab{background:var(--t-collab)} .p-other{background:var(--t-other)}

/* Course layout */
.cgrid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:900px){.cgrid{grid-template-columns:minmax(0,1fr)}}
.cindex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px);max-height:calc(100vh - 100px);overflow:auto}
@media (max-width:900px){.cindex{position:static;max-height:none}}
.cindex summary{padding:12px 16px;font-weight:650;cursor:pointer;font-family:var(--f-display)}
.cindex ul{list-style:none;margin:0;padding:0 8px 10px}
.cindex li>button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:.88rem}
.cindex li>button:hover{background:var(--surface-2)}
.cindex .sname{font-weight:650;margin-top:6px}
.cindex .mname{padding-left:22px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line);flex:none}
.dot.done{background:var(--ok);border-color:var(--ok)}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:16px;scroll-margin-top:80px}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sec-sum{margin-top:8px;color:var(--muted)}
.mods{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column}
.mod{display:flex;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.mod:first-child{border-top:0}
.mod-b{flex:1;min-width:180px;display:flex;flex-direction:column;gap:2px}
.mod-type{font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:650}
.mod-name{background:none;border:0;padding:0;text-align:left;cursor:pointer;font-weight:600;color:var(--brand);font-size:1rem}
.mod-name:hover{text-decoration:underline}
.mod-d{font-size:.82rem;color:var(--muted)}
.mod-d.late{color:var(--bad)}
.mod.is-hidden .mod-b,.mod.is-hidden .ic{opacity:.55}
.label-mod{display:block}
.tools{display:flex;gap:4px;flex-wrap:wrap}
.cbtn{border:1px solid var(--line);background:var(--surface);padding:5px 12px;border-radius:6px;cursor:pointer;font-size:.84rem;font-weight:550}
.cbtn.done{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.btn.add{margin-top:12px;border-style:dashed;width:100%;color:var(--brand)}
.addsec{width:100%;border-style:dashed}

/* Tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.76rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:650;background:var(--surface-2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.kv th{width:34%;text-transform:none;letter-spacing:0;font-size:.9rem;color:var(--ink);background:var(--surface-2);white-space:normal}
.kv td.good{background:var(--ok-soft)} .kv td.late{background:var(--bad-soft)}
.total td{font-weight:700;background:var(--surface-2)}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-weight:600;font-size:.9rem}
.field .hint{font-size:.8rem;color:var(--muted)}
input[type=text],input[type=password],input[type=email],input[type=number],input[type=url],input[type=datetime-local],input[type=search],select,textarea{
  font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 11px;width:100%}
textarea{min-height:120px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:transparent}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:600px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.fgrid .full{grid-column:1/-1}
.check{display:flex;gap:8px;align-items:center;font-size:.92rem}

/* Modal */
#modal:empty{display:none}
.mback{position:fixed;inset:0;background:rgba(8,20,26,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;
  padding:max(40px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.mbox{background:var(--surface);border-radius:12px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.mbox.wide{max-width:760px}
.mbox>header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.mbox .mb{padding:20px;display:flex;flex-direction:column;gap:14px}
.mfoot{display:flex;justify-content:flex-end;gap:8px;padding-top:6px}
.xbtn{background:none;border:0;font-size:1.4rem;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px}
.chooser{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.chooser button{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;cursor:pointer}
.chooser button:hover{border-color:var(--brand);background:var(--brand-soft)}
.chooser small{color:var(--muted);font-size:.8rem;line-height:1.4}

/* Toast */
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;pointer-events:none}
#toast div{background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;box-shadow:var(--shadow);font-weight:550;animation:tin .2s ease-out}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#toast div{animation:none}.switch input::after{transition:none}}

/* Prose */
.prose{display:flex;flex-direction:column;gap:10px;max-width:72ch}
.prose h3,.prose h4,.prose h5{margin-top:8px}
.prose ul,.prose ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px}
.prose code{font-family:var(--f-mono);font-size:.88em;background:var(--surface-2);padding:1px 5px;border-radius:4px}

/* Activity header */
.ahead{display:flex;gap:16px;align-items:center}
.adates{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:.88rem;color:var(--muted);margin-top:4px}
.adates b{color:var(--ink);font-weight:600}

/* Quiz */
.qgrid{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:22px;align-items:start}
@media (max-width:860px){.qgrid{grid-template-columns:minmax(0,1fr)}.qnav{order:-1}}
.q{display:grid;grid-template-columns:150px minmax(0,1fr);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);margin-bottom:16px;scroll-margin-top:80px}
@media (max-width:600px){.q{grid-template-columns:minmax(0,1fr)}}
.qinfo{background:var(--surface-2);padding:14px;font-size:.82rem;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.qinfo b{color:var(--ink);font-size:.95rem}
.qbody{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.qtext{font-weight:550}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:6px;cursor:pointer}
.opt:hover{background:var(--surface-2)}
.opt input{margin-top:4px}
.opt.right{background:var(--ok-soft)} .opt.wrong{background:var(--bad-soft)}
.fb{padding:10px 12px;border-radius:6px;font-size:.9rem}
.fb.right{background:var(--ok-soft);color:var(--ok)} .fb.wrong{background:var(--bad-soft);color:var(--bad)}
.qnav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px)}
.qnav-grid{display:flex;flex-wrap:wrap;gap:6px}
.qnav-grid button{width:34px;height:40px;border:1px solid var(--line);background:var(--surface);border-radius:4px;cursor:pointer;font-weight:650;position:relative;overflow:hidden}
.qnav-grid button.ans{background:linear-gradient(to top,var(--brand-soft) 0 40%,var(--surface) 40%)}
.timer{font-family:var(--f-mono);font-size:1.4rem;font-weight:700;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}

/* Forum */
.post{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:16px 18px;display:flex;gap:14px}
.post .pb{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.reply{margin-left:min(48px,6vw)}

/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal>div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:96px;padding:6px;font-size:.82rem;display:flex;flex-direction:column;gap:4px;min-width:0}
.cal .dow{min-height:0;font-weight:650;color:var(--muted);text-transform:uppercase;font-size:.72rem;letter-spacing:.06em;background:var(--surface-2)}
.cal .out{background:var(--bg);color:var(--muted)}
.cal .today .dn{background:var(--brand);color:var(--brand-ink);border-radius:50%;width:24px;height:24px;display:grid;place-items:center}
.cal .ev{display:block;width:100%;text-align:left;border:0;border-radius:4px;padding:2px 6px;font-size:.76rem;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.mini{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:.8rem}
.mini span{padding:5px 0;border-radius:50%;font-variant-numeric:tabular-nums;position:relative}
.mini .h{font-weight:650;color:var(--muted);font-size:.7rem}
.mini .o{color:var(--muted);opacity:.5}
.mini .t{background:var(--brand);color:var(--brand-ink);font-weight:700}
.mini .e::after{content:"";position:absolute;bottom:1px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--accent)}
@media (max-width:640px){.cal>div{min-height:64px;padding:3px}.cal .ev{font-size:0;height:8px;padding:0}}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat b{display:block;font-family:var(--f-display);font-size:1.7rem;font-variant-numeric:tabular-nums}

/* Login */
.login{min-height:100%;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
@media (max-width:820px){.login{grid-template-columns:minmax(0,1fr)}}
.login-art{background:var(--nav);color:var(--nav-ink);padding:48px max(24px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;justify-content:space-between;gap:32px;
  background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.035) 0 14px,transparent 14px 28px)}
.login-art h1{font-size:clamp(2rem,4vw,3rem);color:#fff}
.login-art p{color:var(--nav-muted);max-width:42ch;font-size:1.05rem}
.codes{display:flex;flex-wrap:wrap;gap:8px}
.codes span{font-family:var(--f-mono);font-size:.78rem;border:1px solid rgba(255,255,255,.25);padding:4px 10px;border-radius:4px;color:var(--nav-ink)}
.login-form{padding:48px max(24px,env(safe-area-inset-right,0px)) 48px 24px;display:flex;flex-direction:column;gap:22px;justify-content:center;max-width:480px;width:100%;margin:0 auto}
.demo-list{display:flex;flex-direction:column;gap:6px}
.demo-list button{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 12px;cursor:pointer;text-align:left}
.demo-list button:hover{border-color:var(--brand)}
.err{background:var(--bad-soft);color:var(--bad);padding:10px 12px;border-radius:6px;font-size:.9rem}
.foot{text-align:center;color:var(--muted);font-size:.8rem;padding:0 16px 30px}
html,body{height:100%}

/* ---- Phase 2–4 additions ---- */
.p-comm{background:var(--t-comm)}
.nav-ico{position:relative;background:none;border:0;color:var(--nav-muted);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.nav-ico:hover{background:var(--nav-hover);color:var(--nav-ink)}
.nav-ico svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.count{position:absolute;top:2px;right:0;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--accent);color:#1b1200;font-size:.68rem;font-weight:800;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.ndrop{position:relative}
.ndrop summary{list-style:none}
.ndrop summary::-webkit-details-marker{display:none}
.ndrop .menu{position:absolute;right:-50px;top:calc(100% + 8px);width:min(360px,calc(100vw - 32px));background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);z-index:30;overflow:hidden}
.nitem{display:flex;gap:10px;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.nitem:hover{background:var(--surface-2)}
.nitem.unread{background:var(--brand-soft)}
.nitem .ud{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:7px;flex:none}
.nitem .ud.r{background:transparent}
.mhead{display:flex;justify-content:space-between;align-items:center;padding:10px 14px}

/* Messages */
.msgs{display:grid;grid-template-columns:300px minmax(0,1fr);border:1px solid var(--line);border-radius:var(--r);background:var(--surface);min-height:520px;overflow:hidden}
@media (max-width:760px){.msgs{grid-template-columns:minmax(0,1fr)}.msgs.open .clist{display:none}.msgs:not(.open) .thread{display:none}}
.clist{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.clist .ci{display:flex;gap:10px;align-items:center;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%}
.clist .ci:hover,.clist .ci.on{background:var(--surface-2)}
.clist .ci .t{min-width:0;flex:1}
.clist .ci .t span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thread{display:flex;flex-direction:column;min-width:0}
.thread header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.tbody{flex:1;padding:16px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;max-height:60vh}
.bubble{max-width:75%;padding:9px 13px;border-radius:14px;background:var(--surface-2);white-space:pre-wrap;word-wrap:break-word}
.bubble.mine{align-self:flex-end;background:var(--brand);color:var(--brand-ink)}
.bubble small{display:block;opacity:.7;font-size:.72rem;margin-top:3px}
.tform{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.tform textarea{min-height:44px;height:44px}

/* Badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.bcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}

.medal{width:84px;height:96px}
.bstrip{display:flex;flex-wrap:wrap;gap:12px}
.bstrip .bmini{display:flex;flex-direction:column;align-items:center;gap:4px;width:96px;text-align:center;font-size:.8rem}
.bstrip .medal{width:54px;height:62px}

/* Certificate */
.cert{position:relative;max-width:820px;margin:0 auto;background:#fffdf8;color:#1d2a31;border:1px solid #d9cfb8;border-radius:6px;padding:clamp(24px,5vw,56px);text-align:center;box-shadow:var(--shadow);
  background-image:linear-gradient(#fffdf8,#fffdf8),repeating-linear-gradient(45deg,#e8dcc0 0 2px,transparent 2px 9px);background-clip:padding-box,border-box;outline:10px solid #f3ead6;outline-offset:-22px}
.cert .eyebrow{color:#7a6a45}
.cert h2{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-size:clamp(1.8rem,4vw,2.6rem);font-weight:600;margin:14px 0 6px;color:#0d3843}
.cert .who{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-size:clamp(1.5rem,3.4vw,2.2rem);font-style:italic;border-bottom:1px solid #cbbd99;display:inline-block;padding:0 24px 6px;margin:10px 0}
.cert .meta{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:28px;font-size:.85rem;color:#4d5a61;text-align:left}
.cert .meta b{display:block;color:#1d2a31}
@media print{.nav,.foot,.tabs,.phead,.noprint{display:none!important}.page{padding:0}.cert{box-shadow:none}}

/* Workshop */
.phases{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin-bottom:18px}
.phase{padding:10px 12px;background:var(--surface-2);border-radius:6px;font-size:.84rem;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.phase b{color:var(--ink);font-size:.9rem}
.phase.on{background:var(--brand);color:var(--brand-ink)}
.phase.on b{color:var(--brand-ink)}
.phase.past{background:var(--ok-soft);color:var(--ok)}
@media (max-width:640px){.phases{grid-template-columns:minmax(0,1fr)}}

/* Lesson */
.lcard{max-width:760px;display:flex;flex-direction:column;gap:14px}
.lprog{display:flex;gap:4px}
.lprog i{flex:1;height:5px;border-radius:4px;background:var(--surface-2)}
.lprog i.d{background:var(--brand)}

/* Glossary */
.letters{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:14px}
.letters button{min-width:32px;padding:5px 8px;border:1px solid var(--line);background:var(--surface);border-radius:4px;cursor:pointer;font-weight:600;font-size:.84rem}
.letters button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.letters button:disabled{opacity:.35;cursor:default}
.gentry{border-bottom:1px solid var(--line);padding:16px 0;display:flex;flex-direction:column;gap:6px}

/* Choice */
.cres{display:flex;flex-direction:column;gap:10px;max-width:620px}
.cres .rowb{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:12px;align-items:center}
.cres .barw{height:22px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.cres .barw i{display:block;height:100%;background:var(--t-comm)}

/* Files */
.fchips{display:flex;flex-wrap:wrap;gap:8px}
.fchip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:6px;padding:6px 10px;background:var(--surface);font-size:.86rem;max-width:100%}
.fchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fchip a{font-weight:600}
.fpreview{max-height:420px;overflow:auto;background:var(--surface-2);padding:14px;border-radius:6px;font-family:var(--f-mono);font-size:.86rem;white-space:pre-wrap}

/* Roles matrix */
.capgrid td,.capgrid th{padding:8px 12px}
.capgrid td.c{text-align:center}
.capgrid .lvl{background:var(--surface-2);font-weight:700;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.okc{color:var(--ok);font-weight:700}
.sel-sm{width:auto;padding:4px 8px;font-size:.84rem}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:18px;text-align:center;color:var(--muted)}
pre.code{background:var(--surface-2);padding:12px;border-radius:6px;overflow-x:auto;font-family:var(--f-mono);font-size:.82rem;margin:0}
.banner{background:var(--accent-soft);color:var(--warn);padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));text-align:center;font-size:.88rem;font-weight:550}

/* ---- Lifecycle, workspaces and governance ---- */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.modesw{display:flex;background:var(--nav-hover);border-radius:20px;padding:3px;gap:2px}
.modesw button{background:none;border:0;color:var(--nav-muted);padding:5px 11px;border-radius:16px;cursor:pointer;font-size:.8rem;font-weight:600;white-space:nowrap}
.modesw button.on{background:var(--accent);color:#1b1200}
@media (max-width:760px){.modesw{order:4;flex-basis:100%;justify-content:center;margin-top:4px}}
.statbtn{text-align:left;cursor:pointer;font:inherit;color:inherit;border-left:4px solid var(--line)}
.statbtn:hover{background:var(--surface-2)}
.st-notstarted{border-left-color:var(--muted)} .st-inprogress{border-left-color:var(--brand)} .st-completed{border-left-color:var(--ok)} .st-overdue{border-left-color:var(--bad)}
.dist{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface-2)}

.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:.84rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.pathsteps{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.pstep{display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.pstep .num{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-weight:700;font-size:.8rem;flex:none}
.pstep.st-completed .num{background:var(--ok);color:#fff}.pstep.st-inprogress .num{background:var(--brand);color:var(--brand-ink)}.pstep.st-overdue .num{background:var(--bad);color:#fff}
.parrow{color:var(--muted)}
.admingrid{display:grid;grid-template-columns:230px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:900px){.admingrid{grid-template-columns:minmax(0,1fr)}}
.adminnav{display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px)}
@media (max-width:900px){.adminnav{position:static;flex-direction:row;flex-wrap:wrap}.adminnav .eyebrow{flex-basis:100%}}
.adminnav .eyebrow{padding:10px 8px 4px}
.adminnav button{background:none;border:0;text-align:left;padding:7px 10px;border-radius:6px;cursor:pointer;color:var(--ink);font:inherit;font-size:.9rem}
.adminnav button:hover{background:var(--surface-2)}.adminnav button.on{background:var(--brand-soft);color:var(--brand);font-weight:650}
.picker{border:1px solid var(--line);border-radius:6px;background:var(--surface)}

table.rubric td{min-width:130px}

.rlevel{display:flex;gap:8px;align-items:flex-start;cursor:pointer;font-size:.86rem}
.rlevel input{margin-top:3px}
.rating{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rating label{position:relative}.rating input{position:absolute;opacity:0}
.rating span{display:grid;place-items:center;width:40px;height:40px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-weight:700;background:var(--surface)}

.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.84rem}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.cert.tpl-modern{background:#fff;outline:none;border:0;border-top:10px solid var(--brand);background-image:none;text-align:left}

.cert .sig{border-top:1px solid #9aa4aa;padding-top:4px;min-width:160px}
.cert.mini{width:140px;height:96px;padding:10px;display:grid;place-items:center;font-size:.8rem;outline-width:4px;outline-offset:-10px;box-shadow:none}
.tplpick{cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}

details>summary{cursor:pointer}
/* Accessibility preferences */
html.hc{--bg:#ffffff;--surface:#ffffff;--surface-2:#eeeeee;--ink:#000000;--muted:#2b2b2b;--line:#5a5a5a;--brand:#00405a;--nav:#000000;--nav-ink:#ffffff;--nav-muted:#ffffff;--accent:#ffcc00}
@media (prefers-color-scheme: dark){html.hc:not([data-theme="light"]){--bg:#000000;--surface:#000000;--surface-2:#1a1a1a;--ink:#ffffff;--muted:#e6e6e6;--line:#bdbdbd;--brand:#7fd6ff;--brand-ink:#000;--nav:#000;--nav-ink:#fff;--nav-muted:#fff;--accent:#ffd400}}

.personagrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}

.backbar{margin:0 0 6px}

.liveframe{display:block;width:100%;height:calc(100vh - 220px);min-height:420px;border:0;border-radius:10px;background:#111}

.vresume[hidden]{display:none}
.backbar .btn{padding-left:6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.backbar .btn span{font-size:1.05em}
.upbar{margin-top:8px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);display:grid;gap:6px;font-size:.84rem}

.qb-head{display:grid;grid-template-columns:auto 1fr minmax(170px,230px);gap:12px;align-items:start}
.qb-num-badge{width:28px;height:28px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-weight:700;font-size:.85rem;color:var(--muted);margin-top:6px}
.qb-card textarea.qb-text{font-size:1.05rem;border:0;box-shadow:none;border-bottom:1px solid var(--line);border-radius:0;background:var(--surface-2);padding:10px 12px;resize:none;overflow:hidden;min-height:44px;line-height:1.4}

.qb-pick{width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);background:transparent;padding:0;display:grid;place-items:center;cursor:pointer;flex:none}
.qb-pick span{width:10px;height:10px;border-radius:50%;background:transparent}
.qb-pick.on{border-color:var(--ok, #21795f)}
.qb-pick.on span{background:var(--ok, #21795f)}
.qb-pick.ghost{border-style:dashed;opacity:.5;cursor:default}
.qb-check{width:22px;text-align:center;color:var(--ok, #21795f);font-weight:700;flex:none}
.qb-check.ghost{opacity:.35}
.qb-x{border:0;background:transparent;font-size:1.3rem;line-height:1;color:var(--muted);width:32px;height:32px;border-radius:50%;cursor:pointer}
.qb-x:hover:not(:disabled){background:var(--surface-2)}
.qb-x:disabled{opacity:.25;cursor:default}
.qb-addopt .link{padding:6px 2px}
.qb-hint{margin:2px 0 0 40px;font-size:.8rem;color:var(--muted)}
.qb-row{display:flex;flex-wrap:wrap;gap:12px;margin-left:40px}
.qb-field{display:grid;gap:4px;font-size:.82rem;color:var(--muted);min-width:160px}
.qb-guide{margin-left:40px;width:calc(100% - 40px)}
.qb-foot{display:flex;align-items:center;gap:6px;border-top:1px solid var(--line);padding-top:10px;flex-wrap:wrap}
.qb-status{flex:1;font-size:.8rem;color:var(--muted);min-width:120px}
.qb-status.ok{color:var(--ok, #21795f)}
.qb-status.warn{color:var(--warn, #9a6b00)}
.qb-status.bad{color:var(--bad)}
.qb-points{display:flex;align-items:center;gap:6px;font-size:.82rem;color:var(--muted)}
.qb-points input{width:70px;padding:6px 8px}
.qb-sep{width:1px;height:24px;background:var(--line);margin:0 4px}
.qb-icon{width:36px;height:36px;border-radius:50%;border:0;background:transparent;font-size:1.05rem;cursor:pointer;color:var(--ink)}
.qb-icon:hover:not(:disabled){background:var(--surface-2)}
.qb-icon:disabled{opacity:.3;cursor:default}
.qb-icon.danger:hover{background:color-mix(in srgb,var(--bad) 12%,transparent)}
.qb-add{margin-top:14px;width:100%;padding:16px;border:2px dashed var(--line);border-radius:12px;background:transparent;font-weight:650;color:var(--brand);cursor:pointer;font-size:.95rem}
.qb-add:hover{border-color:var(--brand);background:var(--brand-soft)}
@media (max-width:640px){.qb-head{grid-template-columns:auto 1fr}.qb-type{grid-column:1 / -1}.qb-opts,.qb-row,.qb-hint{margin-left:0}.qb-guide{margin-left:0;width:100%}.qb-card{padding:14px}}
</style>
